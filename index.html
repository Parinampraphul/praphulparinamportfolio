<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praphul Parinam | Software Engineer & Computer Science Professional</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.7;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Header & Navigation */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            border-bottom: 1px solid var(--border);
            padding: 3.5rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header h2 {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        nav {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border);
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        nav ul li {
            margin: 0 1.25rem;
        }

        nav ul li a {
            display: block;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            padding: 1rem 0.25rem;
            transition: color 0.2s ease;
        }

        nav ul li a:hover, nav ul li a.active {
            color: var(--accent);
        }

        /* Main Layout */
        main {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: border-color 0.2s ease;
        }

        section:hover {
            border-color: rgba(56, 189, 248, 0.4);
        }

        h3 {
            color: var(--text-main);
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
        }

        /* About Grid */
        .about-grid {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 2rem;
            align-items: center;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Projects Grid */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
        }

        .project-card h4 {
            color: var(--accent);
            font-size: 1.15rem;
            margin-bottom: 0.75rem;
        }

        .project-card p {
            color: var(--text-muted);
            font-size: 0.925rem;
            margin-bottom: 1.25rem;
        }

        .badge-container {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        .badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .project-links {
            display: flex;
            gap: 1rem;
        }

        /* Skills List */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            list-style: none;
        }

        .skills-grid li {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .skills-grid li strong {
            color: var(--text-main);
        }

        /* Experience Timeline */
        .experience-item {
            margin-bottom: 1.5rem;
        }

        .experience-item:last-child {
            margin-bottom: 0;
        }

        .experience-item h4 {
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .experience-meta {
            font-size: 0.85rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .experience-item p {
            color: var(--text-muted);
            font-size: 0.925rem;
        }

        /* Contact Section */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 2.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .about-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .profile-img {
                margin: 0 auto;
            }
            header h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Praphul Parinam</h1>
        <h2>Software Engineer & Computer Science Professional</h2>
    </header>

            <li><a
